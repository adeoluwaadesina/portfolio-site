<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .thin  { fill: none; stroke: #3355ff; stroke-width: 2.75; stroke-linecap: round; stroke-linejoin: round; }
    .thick { fill: none; stroke: #3355ff; stroke-width: 8;    stroke-linecap: round; stroke-linejoin: round; }
    .flick { fill: none; stroke: #3355ff; stroke-width: 2;    stroke-linecap: round; stroke-linejoin: round; }
    .cross { fill: none; stroke: #3355ff; stroke-width: 4;    stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .thin, .thick, .flick, .cross { stroke: #7c93ff; }
    }
  </style>
  <path class="thin" d="M8,90 C18,66 28,44 39,19" />
  <path class="thick" d="M39,19 C54,36 67,53 80,67" />
  <path class="flick" d="M80,67 C85,74 89,80 94,85" />
  <path class="cross" d="M16,56 C34,50 55,45 91,33" />
</svg>
